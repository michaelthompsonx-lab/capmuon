[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capmuon"
version = "0.1.0"
description = "O(d_in) Capped Input-Geometry Preconditioning for Muon in Reinforcement Learning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "matplotlib>=3.7", "numpy>=1.24"]
rlvr = ["transformers>=4.57.0", "accelerate>=1.0.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["capmuon*"]
